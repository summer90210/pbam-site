<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recruitment — PBAM SMU</title>
  <meta name="description" content="Recruitment information for the Private Banking and Asset Management Club at SMU.">
  <link rel="icon" type="image/png" href="images/PBAM-Logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <style>
    /* HERO WITH SKYLINE BACKGROUND & CENTERED TITLE */
    .page-hero {
      position: relative !important;
      background-image: url('images/dallas-jpm skyline.png') !important;
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
      background-color: transparent !important;
      overflow: hidden;
      padding: 100px 0 !important;
      text-align: center !important;
    }

    /* Semi-transparent overlay over hero image */
    .page-hero::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(15, 35, 25, 0.65);
      z-index: 1;
    }

    .page-hero-inner {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center !important;
    }

    /* Hide the watermark SVG icon in the background */
    .page-hero > .col-mark {
      display: none !important;
    }

    /* Match "Join PBAM." heading styling to "Asset Management" on Home Page */
    .page-hero h1 {
      font-family: 'Cormorant Garamond', serif !important;
      font-style: italic !important;
      font-weight: 400 !important;
      color: #EAE8DC !important; /* Home page gold/cream accent color */
      margin: 0 auto !important;
      text-align: center !important;
    }

    /* APPLICATION CTA BUTTON STYLES */
    .apply-btn {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 32px;
      background-color: #18352A;
      color: #EAE8DC;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid #18352A;
      border-radius: 4px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .apply-btn:hover {
      background-color: #EAE8DC;
      color: #18352A;
      border-color: #18352A;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(21, 40, 32, 0.15);
    }
  </style>
</head>
<body>

<a href="#main" class="skip-link">Skip to content</a>

<svg style="display:none">
  <symbol id="col-icon" viewBox="0 0 60 60">
    <line x1="8" y1="10" x2="52" y2="10"/>
    <line x1="11" y1="15" x2="49" y2="15"/>
    <line x1="14" y1="20" x2="17" y2="46"/>
    <line x1="24" y1="20" x2="24" y2="46"/>
    <line x1="30" y1="20" x2="30" y2="46"/>
    <line x1="36" y1="20" x2="36" y2="46"/>
    <line x1="46" y1="20" x2="43" y2="46"/>
    <line x1="9" y1="50" x2="51" y2="50"/>
  </symbol>
</svg>

<header id="siteHeader" class="static-light">
  <nav class="wrap">
    <a href="index.html" class="brand">
      <svg class="col-mark" viewBox="0 0 60 60"><use href="#col-icon"/></svg>
      <span class="brand-name">PBAM</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="what-we-do.html">What We Do</a>
      <a href="market-insights.html">Market Insights</a>
      <a href="team.html">Team</a>
      <a href="recruitment.html" aria-current="page">Recruitment</a>
      <a href="recruitment.html" class="nav-cta">Join PBAM</a>
    </div>
  </nav>
</header>

<main id="main">

  <!-- PAGE HERO -->
  <section class="page-hero">
    <div class="wrap page-hero-inner">
      <h1>Join PBAM</h1>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="placeholder-panel reveal">
        <svg class="col-mark" viewBox="0 0 60 60"><use href="#col-icon"/></svg>
        
        <!-- Dynamic content container populated by script -->
        <div id="recruitment-content"></div>
        
        <!-- CLICKABLE APPLICATION LINK BUTTON -->
        <!-- Set href="#" for 'Coming Soon' state, or put your actual application URL here -->
        <a href="https://forms.cloud.microsoft/r/brCaYDeN8b" target="_blank" rel="noopener noreferrer" class="apply-btn" id="applyBtn">
          Apply Now &rarr;
        </a>
      </div>
    </div>
  </section>

</main>

<footer>
  <div class="wrap">
    <div class="foot-top">
      <div class="foot-brand">
        <svg class="col-mark" viewBox="0 0 60 60"><use href="#col-icon"/></svg>
        <span class="foot-brand-name">PBAM</span>
      </div>
      <div class="foot-links">
        <div class="foot-col">
          <h4>Explore</h4>
          <a href="index.html">Home</a>
          <a href="what-we-do.html">What We Do</a>
          <a href="market-insights.html">Market Insights</a>
          <a href="team.html">Team</a>
        </div>
        <div class="foot-col">
          <h4>Connect</h4>
          <a href="recruitment.html">Recruitment</a>
          <a href="https://www.linkedin.com/company/pb-am/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://www.instagram.com/smu.pbam/" target="_blank" rel="noopener noreferrer">Instagram</a>
        </div>
        <div class="foot-col">
          <h4>Southern Methodist University</h4>
          <p>Dallas, TX</p>
        </div>
      </div>
    </div>
    <div class="foot-bottom">
      <span>&copy; 2026 Private Banking &amp; Asset Management Club, SMU.</span>
    </div>
  </div>
</footer>

<script src="script.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const applyBtn = document.getElementById("applyBtn");
    const container = document.getElementById("recruitment-content");

    if (!applyBtn || !container) return;

    // Get raw href attribute to check if it's literally '#' or empty
    const rawHref = applyBtn.getAttribute("href");

    if (rawHref && rawHref.trim() !== "#" && rawHref.trim() !== "") {
      // Live Link State
      container.innerHTML = `
        <div class="eyebrow">Application Is Live!</div>
        <h2>PBAM recruits at the start of each semester</h2>
        <p>Applications for this semester's recruitment are now open! Click the button below to apply.</p>
      `;
      applyBtn.style.display = "inline-block";
    } else {
      // No Link / Placeholder State
      container.innerHTML = `
        <div class="eyebrow">Coming Soon</div>
        <h2>Recruitment details are on the way</h2>
        <p>We're finalizing this semester's recruitment timeline, application, and events. Check back soon for dates and how to apply.</p>
      `;
      // Optionally hide the button if there is no live link
      applyBtn.style.display = "none";
    }
  });
</script>

</body>
</html>
